<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
<<<<<<< HEAD

    <h2>家計簿をつけましょう</h2>

  </header>

  <main class="dashboard">
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">収支を登録</h2>
      <form id="entry-form">
        <p>
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required>
        </p>
        <p>
          <label for="item">品目</label>
          <input type="text" id="item" name="item" placeholder="例：食料品" required>
        </p>
        <p>
          <label for="type">収支区分</label>
          <select id="type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="amount">金額（円）</label>
          <input type="number" id="amount" name="amount" min="1" step="1" placeholder="例：1000" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <div class="overview">
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">収支合計（収入 − 支出）</h2>
        <p><output id="balance" aria-label="収支合計">0円</output></p>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">家計簿一覧</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">日付</th>
              <th scope="col">品目</th>
              <th scope="col">収支区分</th>
              <th scope="col">金額</th>
            </tr>
          </thead>
          <tbody id="entry-list">
            <tr>
              <td colspan="4">登録されたデータはありません。</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
  <p id="app-message" class="app-message" role="status" aria-live="polite"></p>
</body>
</html>
